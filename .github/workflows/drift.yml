name: Weekly California schema drift
on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run drift
      - name: Report drift failure without source records
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Automated] California plugin drift check failed';
            const {owner, repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            if (!issues.some(issue => issue.title === title && !issue.pull_request)) {
              await github.rest.issues.create({owner, repo, title, body: `The weekly schema/conversion/round-trip check failed. Review workflow run ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}. No source records or error payloads are included in this issue.`});
            }
